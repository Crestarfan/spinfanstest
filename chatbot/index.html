<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPIN Fans – Product Chatbot</title>
  <style>
    /* ── Reset & Base ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* ── Chat Container ───────────────────────────── */
    .chat-wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      height: 680px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.15);
      background: #fff;
    }

    /* ── Header ───────────────────────────────────── */
    .chat-header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: #fff;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .chat-header .logo {
      width: 42px;
      height: 42px;
      background: #e94560;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .chat-header .header-info h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .chat-header .header-info p {
      font-size: 12px;
      color: #a8c5da;
      margin-top: 2px;
    }

    .chat-header .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #a8c5da;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Messages ─────────────────────────────────── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: #ddd; border-radius: 4px; }

    .message {
      display: flex;
      gap: 8px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .message.bot .avatar  { background: #e94560; color: #fff; }
    .message.user .avatar { background: #0f3460; color: #fff; }

    .message .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 13.5px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.bot .bubble {
      background: #f4f6f9;
      color: #1a1a2e;
      border-bottom-left-radius: 4px;
    }

    .message.user .bubble {
      background: #0f3460;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    /* markdown-like bold */
    .message .bubble strong { font-weight: 700; }

    /* ── Suggested Questions ──────────────────────── */
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px 16px 10px;
      flex-shrink: 0;
    }

    .suggestion-chip {
      background: #f0f2f5;
      border: 1px solid #dce0e8;
      color: #0f3460;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }

    .suggestion-chip:hover {
      background: #e0e7f5;
      border-color: #0f3460;
    }

    /* ── Input Area ───────────────────────────────── */
    .chat-input-area {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 12px 16px 16px;
      border-top: 1px solid #edf0f4;
      flex-shrink: 0;
      background: #fff;
    }

    #user-input {
      flex: 1;
      resize: none;
      border: 1.5px solid #dce0e8;
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      max-height: 100px;
      line-height: 1.4;
      color: #1a1a2e;
      transition: border-color 0.2s;
    }

    #user-input:focus { border-color: #0f3460; }
    #user-input::placeholder { color: #aab2bc; }

    #send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #e94560;
      border: none;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }

    #send-btn:hover  { background: #c73652; }
    #send-btn:active { transform: scale(0.93); }

    /* ── Typing indicator ─────────────────────────── */
    .typing-indicator .bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 12px 16px;
    }

    .typing-indicator .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9ca3af;
      animation: bounce 1.2s infinite;
    }

    .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%            { transform: translateY(-5px); }
    }

    /* ── Footer ───────────────────────────────────── */
    .chat-footer {
      text-align: center;
      font-size: 11px;
      color: #aab2bc;
      padding: 6px;
      background: #fff;
      flex-shrink: 0;
    }

    .chat-footer a { color: #0f3460; text-decoration: none; }
    .chat-footer a:hover { text-decoration: underline; }

    /* ── Responsive ───────────────────────────────── */
    @media (max-width: 520px) {
      body { padding: 0; align-items: flex-start; }
      .chat-wrapper { max-width: 100%; height: 100vh; border-radius: 0; }
    }
  </style>
</head>
<body>

<div class="chat-wrapper" role="main" aria-label="SPIN Fans product chatbot">

  <!-- Header -->
  <div class="chat-header">
    <div class="logo" aria-hidden="true">🌀</div>
    <div class="header-info">
      <h1>SPIN Fans Assistant</h1>
      <p>Designer Ceiling Fans · Singapore</p>
    </div>
    <div class="status" aria-label="Online">
      <span class="status-dot"></span>Online
    </div>
  </div>

  <!-- Messages -->
  <div class="chat-messages" id="chat-messages" role="log" aria-live="polite" aria-label="Chat messages"></div>

  <!-- Suggested Questions -->
  <div class="suggestions" id="suggestions" role="group" aria-label="Suggested questions"></div>

  <!-- Input -->
  <div class="chat-input-area">
    <textarea
      id="user-input"
      placeholder="Ask about our fans…"
      rows="1"
      aria-label="Type your message"
      maxlength="500"
    ></textarea>
    <button id="send-btn" aria-label="Send message" title="Send">
      ➤
    </button>
  </div>

  <!-- Footer -->
  <div class="chat-footer">
    Powered by <a href="https://spinfans.com.sg/" target="_blank" rel="noopener">spinfans.com.sg</a>
  </div>

</div>

<!-- Knowledge Base & Engine -->
<script src="knowledge-base.js"></script>
<script src="chatbot-engine.js"></script>

<script>
  (function () {
    "use strict";

    var messagesEl  = document.getElementById("chat-messages");
    var inputEl     = document.getElementById("user-input");
    var sendBtn     = document.getElementById("send-btn");
    var suggestionsEl = document.getElementById("suggestions");

    var bot = window.SpinFansChatbot;

    // ── Helpers ──────────────────────────────────────

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderMarkdown(text) {
      // HTML-escape first, then convert **bold** to <strong>
      return escapeHtml(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    }

    function appendMessage(role, text) {
      var msg = document.createElement("div");
      msg.className = "message " + role;

      var avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.setAttribute("aria-hidden", "true");
      avatar.textContent = role === "bot" ? "🌀" : "👤";

      var bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = renderMarkdown(text);

      msg.appendChild(avatar);
      msg.appendChild(bubble);
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return msg;
    }

    function showTyping() {
      var msg = document.createElement("div");
      msg.className = "message bot typing-indicator";
      msg.id = "typing";
      msg.innerHTML =
        '<div class="avatar" aria-hidden="true">🌀</div>' +
        '<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function hideTyping() {
      var el = document.getElementById("typing");
      if (el) el.remove();
    }

    function renderSuggestions(chips) {
      suggestionsEl.innerHTML = "";
      chips.forEach(function (text) {
        var btn = document.createElement("button");
        btn.className = "suggestion-chip";
        btn.textContent = text;
        btn.addEventListener("click", function () {
          sendMessage(text);
        });
        suggestionsEl.appendChild(btn);
      });
    }

    function sendMessage(text) {
      text = (text || inputEl.value).trim();
      if (!text) return;

      inputEl.value = "";
      autoResizeInput();

      // Hide suggestions while responding
      suggestionsEl.innerHTML = "";

      appendMessage("user", text);
      showTyping();

      // Simulate a short delay for natural feel
      setTimeout(function () {
        hideTyping();
        var reply = bot.processMessage(text);
        appendMessage("bot", reply);
        renderSuggestions(bot.getSuggestedQuestions());
      }, 600);
    }

    // ── Auto-resize textarea ─────────────────────────

    function autoResizeInput() {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + "px";
    }

    inputEl.addEventListener("input", autoResizeInput);

    inputEl.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener("click", function () {
      sendMessage();
    });

    // ── Init ─────────────────────────────────────────

    appendMessage("bot", bot.getWelcomeMessage());
    renderSuggestions(bot.getSuggestedQuestions());
  })();
</script>

</body>
</html>
